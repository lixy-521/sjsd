<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lbyz · 校园即时通讯（接入版）</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --brand:      #2d5a8a;
  --brand-dark: #1a3a5c;
  --brand-soft: #eaf3ff;
  --brand-soft-hover: #dce8f8;
  --brand-disabled: #b9cde0;
  --gutter: 14px;
}
body {
  font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  background: #e8ecf0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}
.chat-app {
  width: 820px; max-width: 100%; height: 92vh; max-height: 900px; min-height: 520px;
  background: #fff; border-radius: 6px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.1);
  display: flex; flex-direction: column; overflow: hidden;
}
.chat-header {
  background: linear-gradient(135deg, #1a3a5c, #2d5a8a);
  color: #fff; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.chat-header .avatar {
  width: 38px; height: 38px; border-radius: 4px; overflow: hidden;
  background: #e8ecf1; display: block; flex-shrink: 0;
}
.chat-header .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
.chat-header .chat-info { flex: 1; }
.chat-header .chat-info .name { font-size: 15px; font-weight: 600; letter-spacing: 1px; }
.chat-header .chat-info .status { font-size: 11px; opacity: .6; margin-top: 2px; }
.chat-header .header-actions { display: flex; gap: 6px; }
.chat-header .header-actions button {
  background: rgba(255,255,255,0.1); border: none; color: #fff;
  width: 34px; height: 34px; border-radius: 4px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: background .2s;
}
.chat-header .header-actions button:hover { background: rgba(255,255,255,0.2); }
/* 未配置 AI 时，齿轮按钮闪一下，提示玩家去填 */
.chat-header .header-actions button.attention { animation: gearPulse 1.6s ease-in-out infinite; }
@keyframes gearPulse {
  0%, 100% { background: rgba(255,255,255,0.1); }
  50%      { background: rgba(255,214,102,0.45); }
}
.chat-messages { flex: 1; overflow-y: auto; padding: 14px 0 10px; background: #f5f7fa; }
.chat-inner { display: flex; flex-direction: column; gap: 10px; }
.msg-row {
  display: flex; gap: 10px; max-width: 86%; align-items: center;
  opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s;
}
.msg-row.visible { opacity: 1; transform: translateY(0); }
.msg-row.incoming { align-self: flex-start; padding-right: 16px; padding-left: var(--gutter); }
.msg-row.outgoing { align-self: flex-end; flex-direction: row-reverse; padding-left: 16px; padding-right: var(--gutter); }
.msg-avatar {
  width: 38px; height: 38px; flex: 0 0 38px; border-radius: 5px;
  overflow: hidden; background: #e8ecf1; display: block;
}
.msg-avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
.msg-bubble {
  position: relative; padding: 10px 14px; border-radius: 8px;
  font-size: 14px; line-height: 1.6; word-break: break-word;
  white-space: pre-wrap;   /* AI 回复里的换行按原样显示 */
}
.msg-row.incoming .msg-bubble { background: #fff; color: #333; border-bottom-left-radius: 0; }
.msg-row.outgoing .msg-bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 0; }
.msg-row.incoming .msg-bubble::before {
  content: ''; position: absolute; left: -6px; bottom: 0; width: 12px; height: 12px;
  background: inherit; clip-path: polygon(100% 0, 100% 100%, 0 100%);
}
.msg-row.outgoing .msg-bubble::before {
  content: ''; position: absolute; right: -6px; bottom: 0; width: 12px; height: 12px;
  background: inherit; clip-path: polygon(0 0, 100% 100%, 0 100%);
}
/* 开场里那两条脚本自动回复：灰底小黑字 */
.msg-row .msg-bubble.auto-reply { background: #f0f0f0; color: #666; font-size: 13px; }
/* AI 接管的回复：白底，但左上角挂一个小标记，和脚本回复区分开 */
.msg-row .msg-bubble.ai-reply { padding-top: 20px; }
.msg-row .msg-bubble.ai-reply::after {
  content: 'AI'; position: absolute; top: 4px; left: 10px;
  font-size: 9px; letter-spacing: .5px; color: #8aa8c4;
  border: 1px solid #cfe0f0; border-radius: 3px; padding: 0 3px; line-height: 1.35;
}
.msg-row .msg-bubble.link-card {
  display: inline-block; background: var(--brand-soft); color: var(--brand);
  font-size: 13px; font-weight: 600; font-family: inherit; text-align: left;
  text-decoration: none; border: none; border-left: 3px solid var(--brand);
  cursor: pointer; transition: background .2s, border-color .2s; white-space: normal;
}
.msg-row .msg-bubble.link-card:hover { background: var(--brand-soft-hover); color: var(--brand-dark); text-decoration: none; }
.msg-row a.msg-bubble.link-card { padding-right: 30px; position: relative; }
.msg-row a.msg-bubble.link-card::after {
  content: '↗'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 12px; font-weight: 400; opacity: .5;
}
.msg-row .msg-bubble.img-bubble { padding: 4px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); white-space: normal; }
.msg-bubble.img-bubble img {
  display: block; width: 240px; max-width: 100%; border-radius: 4px; cursor: zoom-in;
}
/* 出错 / 系统提示：沙色，居中偏左 */
.msg-row .msg-bubble.sys-note {
  background: #fff7e6; color: #8a6d1f; border: 1px solid #f0dcae;
  font-size: 13px; white-space: normal;
}
.msg-row .msg-bubble.sys-error {
  background: #fdecec; color: #a33; border: 1px solid #f2c9c9;
  font-size: 13px; white-space: normal;
}
.msg-bubble .retry-btn {
  display: inline-block; margin-top: 8px; padding: 4px 10px;
  background: #a33; color: #fff; border: none; border-radius: 3px;
  font-size: 12px; font-family: inherit; cursor: pointer;
}
.msg-bubble .retry-btn:hover { background: #8a2a2a; }
/* 「正在输入」三点 */
.typing-dots { display: inline-flex; gap: 4px; align-items: center; height: 18px; }
.typing-dots i {
  width: 6px; height: 6px; border-radius: 50%; background: #b9cde0;
  animation: dotBlink 1.2s infinite ease-in-out;
}
.typing-dots i:nth-child(2) { animation-delay: .2s; }
.typing-dots i:nth-child(3) { animation-delay: .4s; }
@keyframes dotBlink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
.img-viewer {
  position: fixed; inset: 0; z-index: 9999; display: none;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,.78); cursor: zoom-out; padding: 24px;
}
.img-viewer.show { display: flex; }
.img-viewer img { max-width: 92vw; max-height: 92vh; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,.5); cursor: default; }
.img-viewer .viewer-close {
  position: absolute; top: 16px; right: 20px; width: 36px; height: 36px;
  line-height: 34px; text-align: center; font-size: 22px; color: #fff;
  background: rgba(255,255,255,.14); border: 0; border-radius: 50%; cursor: pointer; padding: 0;
}
.img-viewer .viewer-close:hover { background: rgba(255,255,255,.28); }
.msg-stamp {
  align-self: center; margin: 4px 0 6px; padding: 2px 8px; border-radius: 4px;
  background: rgba(0,0,0,0.055); font-size: 11.5px; line-height: 1.5;
  color: #999; letter-spacing: .5px;
}
.chat-input-area {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 12px 14px 14px; border-top: 1px solid #e8e8e8; background: #fff; flex-shrink: 0;
}
.chat-input-area input[type="text"] {
  flex: 1 1 auto; min-width: 0; max-width: 660px; padding: 10px 14px;
  border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none;
  transition: border-color .2s; font-family: inherit; background: #f5f7fa;
}
.chat-input-area input[type="text"]:focus { border-color: var(--brand); background: #fff; }
.chat-input-area .send-btn {
  min-width: 64px; height: 40px; padding: 0 16px;
  background: var(--brand); color: #fff; border: none; border-radius: 4px;
  font-size: 14px; font-family: inherit; letter-spacing: 1px; cursor: pointer;
  transition: background .2s, transform .1s;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.chat-input-area .send-btn:hover { background: var(--brand-dark); }
.chat-input-area .send-btn:active { transform: scale(.96); }
.chat-input-area .send-btn:disabled { background: var(--brand-disabled); cursor: default; }
/* 输入区左侧那个小齿轮：没配置时也闪 */
.chat-input-area .cfg-btn {
  flex-shrink: 0; width: 40px; height: 40px; border: 1px solid #ddd; border-radius: 4px;
  background: #f5f7fa; color: #555; font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background .2s, border-color .2s;
}
.chat-input-area .cfg-btn:hover { background: #e9eef5; border-color: var(--brand); }
.chat-input-area .cfg-btn.attention { animation: gearPulseDark 1.6s ease-in-out infinite; }
@keyframes gearPulseDark {
  0%, 100% { background: #f5f7fa; border-color: #ddd; }
  50%      { background: #fff2cc; border-color: #e0b84a; }
}
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

/* ============================================================ AI 接入设置窗口 */
.cfg-panel {
  position: fixed; z-index: 500; width: 430px; max-width: calc(100vw - 24px);
  max-height: calc(100vh - 24px); display: none; flex-direction: column;
  background: #fff; border: 1px solid #c3d2e0; border-radius: 7px;
  box-shadow: 0 14px 48px rgba(20,40,70,.28); overflow: hidden;
}
.cfg-panel.show { display: flex; }
.cfg-panel .cfg-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; background: linear-gradient(135deg, #1a3a5c, #2d5a8a);
  color: #fff; cursor: move; user-select: none; flex-shrink: 0;
}
.cfg-panel .cfg-head .t { flex: 1; font-size: 13.5px; font-weight: 600; letter-spacing: .5px; }
.cfg-panel .cfg-head button {
  width: 24px; height: 24px; border: 0; border-radius: 3px; cursor: pointer;
  background: rgba(255,255,255,.14); color: #fff; font-size: 15px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.cfg-panel .cfg-head button:hover { background: rgba(255,255,255,.3); }
.cfg-panel .cfg-body {
  padding: 12px 14px 14px; overflow-y: auto; font-size: 13px; color: #333;
}
.cfg-panel .cfg-body > .hint {
  background: #f5f8fc; border: 1px solid #dde7f1; border-radius: 4px;
  padding: 8px 10px; font-size: 12px; line-height: 1.7; color: #4a6b8a; margin-bottom: 12px;
}
.cfg-panel label { display: block; font-size: 12.5px; font-weight: 600; color: #33475c; margin: 11px 0 4px; }
.cfg-panel label .opt { font-weight: 400; color: #8a9bac; font-size: 11.5px; }
.cfg-panel label:first-of-type { margin-top: 0; }
.cfg-panel input[type="text"], .cfg-panel input[type="password"],
.cfg-panel input[type="number"], .cfg-panel textarea {
  width: 100%; padding: 8px 10px; border: 1px solid #cdd8e3; border-radius: 4px;
  font-size: 13px; font-family: inherit; outline: none; background: #fbfcfe; color: #222;
}
.cfg-panel input:focus, .cfg-panel textarea:focus { border-color: var(--brand); background: #fff; }
.cfg-panel textarea { resize: vertical; min-height: 96px; line-height: 1.6; }
.cfg-panel .row-flex { display: flex; gap: 8px; align-items: center; }
.cfg-panel .row-flex input { flex: 1 1 auto; }
.cfg-panel .mini {
  flex-shrink: 0; padding: 8px 11px; border: 1px solid #cdd8e3; border-radius: 4px;
  background: #f5f7fa; color: #44607d; font-size: 12px; font-family: inherit; cursor: pointer;
}
.cfg-panel .mini:hover { background: #e9eef5; }
.cfg-panel .chk { display: flex; align-items: center; gap: 7px; margin-top: 11px; font-weight: 400; color: #33475c; font-size: 12.5px; }
.cfg-panel .chk input { width: auto; margin: 0; }
.cfg-panel .cfg-foot { display: flex; gap: 8px; margin-top: 15px; align-items: center; flex-wrap: wrap; }
.cfg-panel .btn-primary {
  padding: 8px 18px; background: var(--brand); color: #fff; border: 0; border-radius: 4px;
  font-size: 13px; font-family: inherit; cursor: pointer; letter-spacing: .5px;
}
.cfg-panel .btn-primary:hover { background: var(--brand-dark); }
.cfg-panel .btn-ghost {
  padding: 8px 14px; background: #fff; color: #44607d; border: 1px solid #cdd8e3;
  border-radius: 4px; font-size: 13px; font-family: inherit; cursor: pointer;
}
.cfg-panel .btn-ghost:hover { background: #f5f7fa; }
.cfg-panel .cfg-status { margin-top: 10px; font-size: 12px; line-height: 1.6; min-height: 18px; }
.cfg-panel .cfg-status.ok { color: #1c7c3f; }
.cfg-panel .cfg-status.err { color: #b03030; }
.cfg-panel .cfg-status.wait { color: #8a6d1f; }
.cfg-panel .adv-toggle {
  margin-top: 12px; font-size: 12px; color: var(--brand); cursor: pointer;
  background: none; border: 0; padding: 0; font-family: inherit; text-decoration: underline;
}
.cfg-panel .adv { display: none; margin-top: 4px; }
.cfg-panel .adv.show { display: block; }
.cfg-panel .spoiler-warn { color: #b03030; font-weight: 400; font-size: 11.5px; }

@media (max-width: 900px) {
  body { padding: 8px; }
  .chat-app { height: 96vh; max-height: none; border-radius: 5px; }
  .msg-row { max-width: 92%; }
  .msg-bubble.img-bubble img { width: 200px; }
}
@media (max-width: 560px) {
  body { padding: 0; }
  .chat-app { height: 100vh; border-radius: 0; box-shadow: none; }
  .chat-header { padding: 12px 14px; }
  .chat-input-area { padding: 10px 12px; }
  .chat-input-area input[type="text"] { max-width: none; }
  .cfg-panel { width: calc(100vw - 16px); }
}
</style>
</head>
<body>
<div class="chat-app">
  <div class="chat-header">
    <div class="avatar" id="headerAvatar"></div>
    <div class="chat-info">
      <div class="name">刘天清（刘哥）</div>
      <div class="status" id="headerStatus">lbyz 在线</div>
    </div>
    <div class="header-actions">
      <button id="cfgBtnTop" title="AI 接入设置">⚙</button>
      <button title="清空记录" onclick="clearHistory()" style="font-size:13px;">🗑</button>
      <button title="回到最新消息" onclick="scrollToBottom()">↓</button>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="chat-inner" id="chatInner"></div>
  </div>

  <div class="chat-input-area">
    <button class="cfg-btn" id="cfgBtnBottom" title="AI 接入设置">⚙</button>
    <input type="text" id="msgInput" placeholder="输入消息..." autocomplete="off" spellcheck="false">
    <button class="send-btn" id="sendBtn">发送</button>
  </div>
</div>

<!-- 图片放大查看 -->
<div class="img-viewer" id="imgViewer">
  <img id="imgViewerPic" src="" alt="图片">
  <button type="button" class="viewer-close" id="imgViewerClose" aria-label="关闭">×</button>
</div>

<!-- ====================================================== AI 接入设置窗口 -->
<div class="cfg-panel" id="cfgPanel">
  <div class="cfg-head" id="cfgHead">
    <span class="t">AI 接入设置</span>
    <button type="button" id="cfgClose" title="关闭">×</button>
  </div>
  <div class="cfg-body">
    <div class="hint">
      开场那几句是脚本写死的。从你发出第一条消息起，<b>刘天清的回复改由 AI 生成</b>，
      开场对话会作为上下文一起发给模型。<br>
      本窗口只把配置存在你本地浏览器里（localStorage），不会上传到任何第三方；
      调用时由页面<b>直接</b>请求你填的服务地址，所以对方需要允许跨域（CORS）。
    </div>

    <label for="cfgBase">接口地址 base_url</label>
    <input type="text" id="cfgBase" placeholder="https://api.deepseek.com/v1" autocomplete="off" spellcheck="false">

    <label for="cfgModel">模型名 model</label>
    <input type="text" id="cfgModel" placeholder="deepseek-chat" autocomplete="off" spellcheck="false">

    <label for="cfgKey">API Key</label>
    <div class="row-flex">
      <input type="password" id="cfgKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
      <button type="button" class="mini" id="cfgEye">显示</button>
    </div>

    <label for="cfgTemp">温度 temperature <span class="opt">（0–2，越高越放得开；对话建议 0.8–1.0）</span></label>
    <input type="number" id="cfgTemp" min="0" max="2" step="0.1" value="0.9">

    <div class="chk"><input type="checkbox" id="cfgStream" checked><label for="cfgStream" style="margin:0;font-weight:400;">流式输出（一个字一个字往外蹦）</label></div>
    <div class="chk"><input type="checkbox" id="cfgBadge" checked><label for="cfgBadge" style="margin:0;font-weight:400;">给 AI 回复打一个「AI」小标记</label></div>

    <button type="button" class="adv-toggle" id="cfgAdvToggle">高级设置（系统提示词 / 生成参数）</button>
    <div class="adv" id="cfgAdv">
      <label for="cfgSys">系统提示词 <span class="spoiler-warn">（改动可能剧透或让角色崩坏）</span></label>
      <textarea id="cfgSys" spellcheck="false"></textarea>
      <button type="button" class="mini" id="cfgSysReset" style="margin-top:6px;">恢复默认提示词</button>

      <label for="cfgMaxTok">单次回复上限 max_tokens <span class="opt">（留空则用服务端默认）</span></label>
      <input type="number" id="cfgMaxTok" min="1" step="1" placeholder="例如 800">

      <label for="cfgHist">最多带入多少条历史消息 <span class="opt">（不含开场白）</span></label>
      <input type="number" id="cfgHist" min="0" step="2" value="20">

      <label for="cfgTimeout">请求超时（秒）</label>
      <input type="number" id="cfgTimeout" min="5" step="5" value="90">
    </div>

    <div class="cfg-foot">
      <button type="button" class="btn-primary" id="cfgSave">保存</button>
      <button type="button" class="btn-ghost" id="cfgTest">测试连接</button>
      <button type="button" class="btn-ghost" id="cfgClear">清除配置</button>
    </div>
    <div class="cfg-status" id="cfgStatus"></div>
  </div>
</div>

<script>
/* ============================================================================
   index2：在 index 的基础上，把刘天清的回复从「关键词脚本」换成「真 AI」。
   ----------------------------------------------------------------------------
   · 开场那段对话与 index.html 完全一致（含首图、三条链接卡片、两条脚本自动回复）
   · 从玩家发出的第一条消息起，回复改由 OpenAI 兼容接口生成，
     开场对话连同后续全部聊天记录一起作为上下文发给模型
   · 接口地址 / 模型名 / API Key 由玩家在右上角或输入框左侧的 ⚙ 窗口里填写
   ========================================================================== */
(function() {
  'use strict';

  var scrollBox = document.getElementById('chatMessages');
  var container = document.getElementById('chatInner');
  var input     = document.getElementById('msgInput');
  var sendBtn   = document.getElementById('sendBtn');
  var statusEl  = document.getElementById('headerStatus');
  var isProcessing = false;

  /* ------------------------------------------------------------ 图片放大查看 */
  var viewer = document.getElementById('imgViewer');
  var viewerPic = document.getElementById('imgViewerPic');
  function openViewer(src, alt) {
    viewerPic.src = src;
    viewerPic.alt = alt || '图片';
    viewer.classList.add('show');
  }
  function closeViewer() {
    viewer.classList.remove('show');
    viewerPic.src = '';
  }
  container.addEventListener('click', function (e) {
    var img = e.target.closest('.msg-bubble.img-bubble img');
    if (img) openViewer(img.src, img.alt);
  });
  viewer.addEventListener('click', closeViewer);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && viewer.classList.contains('show')) closeViewer();
  });

  /* ============================================================ 配置读写 */
  var CFG_KEY    = 'lbyz_ai_config_v1';
  var THREAD_KEY = 'lbyz_chat_history_v2_ai';

  /* --------------------------------------------------- 刘天清的角色提示词
     严格在角色内：只按现有剧情与世界观说话，不剧透、不跳出角色。      */
  var DEFAULT_SYS = [
    '你在一个中文悬疑解谜游戏里扮演「刘天清」，玩家是他在怀璧的朋友（李令炉）。',
    '',
    '【你是谁】',
    '刘天清，外号「刘哥」，怀璧一中学生。为了查山经书店和董新飞的事在帮忙，',
    '但家长非让你去羊村市的「蒂中帝」机构封闭补习。',
    '所以你在聊天里设了个脚本/接口自动回话——你人不在，回复是过你这边转出去的。',

  function loadCfg() {
    var c = {};
    for (var k in DEFAULTS) if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) c[k] = DEFAULTS[k];
    try {
      var raw = localStorage.getItem(CFG_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        for (var k2 in c) if (Object.prototype.hasOwnProperty.call(o, k2) && o[k2] !== null && o[k2] !== '') c[k2] = o[k2];
      }
    } catch (e) {}
    return c;
  }
  function saveCfg(c) {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {}
  }
  function cfgReady(c) {
    return !!(c && c.key && c.model && c.base);
  }

  var config = loadCfg();

      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveThread() {
    try { localStorage.setItem(THREAD_KEY, JSON.stringify(history)); } catch (e) {}
  }

  /* ============================================================ 渲染基础件 */
  function scrollToBottom() {
    setTimeout(function() { scrollBox.scrollTop = scrollBox.scrollHeight; }, 50);
  }
  function timeStr() {
    var now = new Date();
    return String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  }

  var lastStampAt = 0, stampCount = 0;
  function addStamp(force) {
    var now = Date.now();
    var first = stampCount === 0;
    if (!force && !first && (now - lastStampAt) < 5 * 60 * 1000) return;
    lastStampAt = now; stampCount++;
    var el = document.createElement('div');
    el.className = 'msg-stamp';
    el.textContent = timeStr();
    container.appendChild(el);
  }
  function resetStamps() { lastStampAt = 0; stampCount = 0; }

  /* 组装一行消息的外壳，返回 { row, bubble } */
  function makeRow(type) {
    var row = document.createElement('div');
    row.className = 'msg-row ' + (type === 'out' ? 'outgoing' : 'incoming');
    var wrap = document.createElement('div');
    var bubble = document.createElement('div');
    wrap.appendChild(bubble);
    row.appendChild(makeAvatar(type));
    row.appendChild(wrap);
    return { row: row, bubble: bubble };
  }

  function addMsg(text, type, auto, persist, link, ai) {
    var parts = makeRow(type);
    parts.bubble.className = 'msg-bubble'
      + (auto ? ' auto-reply' : '')
      + (ai && config.badge ? ' ai-reply' : '');
    if (link) {
      parts.bubble.appendChild(document.createTextNode(text));
      var a = document.createElement('a');
      a.textContent = link.label;
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.cssText = 'color:#0b5d34;font-weight:700;text-decoration:underline;';
      parts.bubble.appendChild(a);
    } else {
      parts.bubble.textContent = text;
    }
    addStamp();
    container.appendChild(parts.row);
    if (persist) {
      history.push({ kind: 'msg', text: text, type: type, auto: !!auto, ai: !!ai,
                     link: link || null, time: timeStr() });
      saveThread();
    }
    parts.row.classList.add('visible');
    scrollToBottom();
    return parts.bubble;
  }

  function addImage(src, type, persist, mime, more, label) {
    var parts = makeRow(type);
    parts.bubble.className = 'msg-bubble img-bubble';
    var list = [{ src: src, mime: mime || mimeOf(src) }].concat(more || []);
    list.forEach(function (p) {
      parts.bubble.appendChild(makeImg(p.src, label, true));
    });
    addStamp();
    container.appendChild(parts.row);
    if (persist) {
      history.push({ kind: 'img', src: src, type: type, mime: mime || mimeOf(src),
                     more: more || null, label: label || null, time: timeStr() });
      saveThread();
    }
    parts.row.classList.add('visible');
    scrollToBottom();
    return parts.bubble;
  }

  /* 从 data URL 头部读出 MIME，老记录里没有 mime 字段时兜底 */
  function mimeOf(src) {
    var m = /^data:(image\/[a-z+]+)[;,]/.exec(String(src || ''));
    return m ? m[1] : 'image/png';
  }

  /* 大图统一走「webp 优先、jpg 回落」：两种格式都比原 PNG 小得多
     （webp 小 94%，jpg 小 89%），所以不管浏览器支持哪种都会快很多。
     data: 开头（历史里存的旧图）不做替换，直接用。                        */
  function makeImg(src, alt, lazy) {
    var im = document.createElement('img');
    im.alt = alt || '图片';
    im.decoding = 'async';
    if (lazy) im.loading = 'lazy';
    var s = String(src || '');
    var base = s.replace(/\.(png|jpe?g)$/i, '');
    if (base !== s) {
      im.dataset.fallback = base + '.jpg';
      im.onerror = function () {
        /* 只回落一次，避免 webp / jpg 都挂掉时无限循环 */
        if (im.dataset.fallback) {
          var next = im.dataset.fallback;
          im.dataset.fallback = '';
          im.src = next;
        }
      };
      im.src = base + '.webp';
    } else {
      im.src = s;
    }
    return im;
  }

  function addLinkCard(label, target, persist) {
    var parts = makeRow('in');
    var node;
    if (target.url) {
      node = document.createElement('a');
      node.href = target.url;
      node.target = '_blank';
      node.rel = 'noopener noreferrer';
    } else {
      node = document.createElement('button');
      node.type = 'button';
      node.addEventListener('click', function() { if (target.alert) alert(target.alert); });
    }
    node.className = 'msg-bubble link-card';
    node.textContent = label;
    node.setAttribute('title', target.url ? '在新标签页中打开' : '查看提示');
    parts.bubble.parentNode.replaceChild(node, parts.bubble);
    addStamp();
    container.appendChild(parts.row);
    if (persist) {
      history.push({ kind: 'link', label: label, url: target.url || null,
                     alert: target.alert || null, time: timeStr() });
      saveThread();
    }
    parts.row.classList.add('visible');
    scrollToBottom();
  }

  /* 系统提示行（不出现在历史里，刷新就没了） */
  function addNote(text, kind) {
    var parts = makeRow('in');
    parts.bubble.className = 'msg-bubble ' + (kind === 'error' ? 'sys-error' : 'sys-note');
    parts.bubble.textContent = text;
    addStamp();
    container.appendChild(parts.row);
    parts.row.classList.add('visible');
    scrollToBottom();
    return parts.bubble;
  }

  /* 「正在输入」气泡，返回移除函数 */
  var removeTypingNow = null;      // 当前那个「正在输入」气泡的移除函数
  function addTyping() {
    var parts = makeRow('in');
    parts.bubble.className = 'msg-bubble';
    parts.bubble.innerHTML = '<span class="typing-dots"><i></i><i></i><i></i></span>';
    container.appendChild(parts.row);
    scrollToBottom();
    var kill = function() {
      if (parts.row.parentNode) parts.row.parentNode.removeChild(parts.row);
      if (removeTypingNow === kill) removeTypingNow = null;
    };
    removeTypingNow = kill;
    return kill;
  }
  /* 落定回复之前先把「正在输入」收掉，否则它会变成一个空气泡留在聊天里 */
  function killTyping() {
    if (removeTypingNow) removeTypingNow();
    removeTypingNow = null;
  }

  function pause(cb) { setTimeout(function() { if (cb) cb(); }, 400 + Math.random() * 600); }

  /* ============================================================ 开场播放 */
  function buildQueue() {
    var queue = [];
    for (var i = 0; i < OPENING.length; i++) {
      if (i === LINK_INDEX) {
        LINK_PAGES.forEach(function(p) { queue.push({ kind: 'link', page: p }); });
      }
      queue.push({ kind: 'msg', msg: OPENING[i] });
    }
    return queue;
  }

  function playQueue(index) {
    if (index >= queue.length) { onOpeningDone(); return; }
    var item = queue[index];
    if (item.kind === 'link') {
      pause(function() {
        addLinkCard(item.page.label, item.page, true);
        setTimeout(function() { playQueue(index + 1); }, 500 + Math.random() * 400);
      });
    } else {
      pause(function() {
        if (item.msg.img) addImage(item.msg.img, item.msg.type, true);
        else addMsg(item.msg.text, item.msg.type, item.msg.auto || false, true, item.msg.link || null, false);
        setTimeout(function() { playQueue(index + 1); }, 400 + Math.random() * 300);
      });
    }
  }

  /* 开场放完之后：能说话就把输入框放开 */
  function onOpeningDone() {
    if (!cfgReady(config)) {
      input.disabled = true;
      input.placeholder = '先在 ⚙ 里填好接口和 API Key…';
      addNote('⚠ 还没配置 AI 接入。点右上角或输入框左边的 ⚙，把接口地址、模型名、API Key 填上，' +
              '刘天清才能继续回你话。', 'note');
    } else {
      input.disabled = false;
      input.placeholder = '输入消息...';
      input.focus();
    }
    refreshStatus();
  }

  var queue = buildQueue();
  function playInitialMessages() { resetStamps(); playQueue(0); }

  /* ============================================================ 上下文组装
     把开场白 + 玩家与 AI 的后续对话一起喂给模型。
     刘天清发过的图片在上下文里只留一句「（发了图片）」，不重复塞图片数据。 */
  function buildContext(turns) {
    var msgs = [];

    for (var j = 0; j < OPENING.length; j++) {
      var m = OPENING[j];
      if (m.img) { msgs.push({ role: 'user', content: '（发来一张图片）' }); continue; }
      msgs.push({ role: (m.type === 'out' ? 'user' : 'assistant'), content: m.text });
    }

    turns.forEach(function (t) {
      if (t.kind === 'img') { msgs.push({ role: 'assistant', content: '（发了图片）' }); return; }
      if (t.kind === 'link') { msgs.push({ role: 'assistant', content: '（发了链接：' + t.label + '）' }); return; }
      /* 模型自己发的回复里可能带着图片标记，喂回上下文时换成一句人话 */
      var body = t.type === 'out' ? t.text : splitImages(t.text).body;
      msgs.push({ role: (t.type === 'out' ? 'user' : 'assistant'), content: body });
    });
    return msgs;
  }

  /* 只取「玩家发出第一条消息之后」的历史，并截断到最后 N 条 */
  function tailTurns() {
    var firstUser = -1;
    for (var i = 0; i < history.length; i++) {
      if (history[i].kind === 'img' && history[i].type === 'out') { firstUser = i; break; }
      if (history[i].kind === 'msg' && history[i].type === 'out') { firstUser = i; break; }
    }
    if (firstUser < 0) return [];
    var turns = history.slice(firstUser);
    var n = parseInt(config.hist, 10);
    if (!isNaN(n) && n > 0 && turns.length > n) turns = turns.slice(turns.length - n);
    return turns;
  }


  /* ============================================================ 调用 AI 接口 */
  var reqSeq = 0;   // 每次请求自增，用来丢弃过期响应

  function endpointOf(cfg) {
    var b = String(cfg.base || '').trim().replace(/\/+$/, '');
    if (/\/chat\/completions$/.test(b)) return b;
    if (/\/v\d+$/.test(b)) return b + '/chat/completions';
    return b + '/v1/chat/completions';
  }

  /* 从失败响应里尽量读出服务端给的原因 */
  function explain(res, bodyText) {
    var d = '';
    try {
      var j = JSON.parse(bodyText);
      d = (j.error && (j.error.message || j.error.type)) || j.message || '';
    } catch (e) { d = String(bodyText || '').slice(0, 200); }
    if (res.status === 401 || res.status === 403) return 'API Key 不对或没权限（HTTP ' + res.status + '）。' + (d ? ' 服务端说：' + d : '');
    if (res.status === 404) return '接口地址或模型名不对（HTTP 404）。检查 base_url 要不要带 /v1，以及模型名拼写。' + (d ? ' 服务端说：' + d : '');
    if (res.status === 429) return '被限流或余额不足（HTTP 429）。' + (d ? ' 服务端说：' + d : '');
    return '接口返回 HTTP ' + res.status + '。' + (d ? ' 服务端说：' + d : '');
  }

  /* ---------------------------------------------- AI 想发链接时的标记解析
     模型会在回复里单独写一行 [[链接:文字|地址]]，这里把它摘出来，
     渲染成和开场一样的链接卡片，正文里那一行本身去掉。
     只放行站内相对路径和公众号那一条，避免它乱发外部网址。            */
  /* 标签里本身带方括号（例如「[4] 山经书店在线服务平台」），所以标签部分只排掉 |，
     不排 ]；地址部分再排 ]，靠 }} 收尾。 */
  var LINK_MARK = /\[\[\s*链接\s*[:：]\s*([^|]+?)\s*\|\s*([^\]]+?)\s*\]\]/g;
  var LINK_OK = /^(forum\/|news\/|platform\/|northland\/|admin\/|assets\/|https:\/\/mp\.weixin\.qq\.com\/)/;

  function splitLinks(text) {
    var links = [];
    var body = String(text || '').replace(LINK_MARK, function (all, label, url) {
      var u = url.trim();
      if (LINK_OK.test(u)) links.push({ label: label.trim(), url: u });
      return '';
    });
    body = body.replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g, '\n').trim();
    return { body: body, links: links };
  }

  /* ---------------------------------------------- 刘天清发图片（标记解析）
     他不能凭空生成图片，只能从站内已有的素材里挑。想发的时候在回复里单独写
     一行 [[图片:sw]]，页面把它摘出来渲染成聊天气泡里的图片，正文里那行去掉。
     只放行下面这张白名单，免得模型乱指路径。                            */
  var PHOTOS = {
    sw:  { file: 'assets/sw.png',  label: '舒巍的工位' },
    yjy: { file: 'assets/yjy.png', label: '余皎颖的工位' },
    ccw: { file: 'assets/ccw.png', label: '陈超武的工位' }
  };
  /* 允许 [[图片:sw]]、[[图片:sw.png]]、[[图片:assets/sw.png]] 三种写法 */
  var IMG_MARK = /\[\[\s*图片\s*[:：]\s*([^\]|]+?)\s*\]\]/g;

  function photoFor(k) {
    var s = String(k || '').trim()
      .replace(/^assets\//i, '')
      .replace(/\.(png|jpe?g|webp|gif)$/i, '');
    return PHOTOS[s.toLowerCase()] || null;
  }

  function splitImages(text) {
    var pics = [];
    var body = String(text || '').replace(IMG_MARK, function (all, key) {
      var p = photoFor(key);
      if (p) pics.push(p);
      return '';
    });
    /* 标记独占一行，摘掉后会留下空行；收成单换行，免得气泡里出现莫名空档 */
    body = body.replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g, '\n')
               .replace(/\n{2,}/g, '\n').trim();
    return { body: body, pics: pics };
  }

  /* 把一张图作为「刘天清发的图片」插进聊天，并写进历史 */
  function appendPhoto(p) {
    var parts = makeRow('in');
    parts.bubble.className = 'msg-bubble img-bubble';
    parts.bubble.appendChild(makeImg(p.file, p.label, true));
    addStamp();
    container.appendChild(parts.row);
    history.push({ kind: 'img', src: p.file, label: p.label, type: 'in', time: timeStr() });
    saveThread();
    parts.row.classList.add('visible');
    scrollToBottom();
  }

  /* 画一条 AI 回复：正文气泡 + 可能要发的图片 / 链接卡片 */
  function renderReply(text) {
    var imgs = splitImages(text);
    var r = splitLinks(imgs.body);
    if (r.body) addMsg(r.body, 'in', false, true, null, true);
    else if (!r.links.length && !imgs.pics.length) addMsg(text, 'in', false, true, null, true);
    r.links.forEach(function (l) { addLinkCard(l.label, { url: l.url }, true); });
    imgs.pics.forEach(function (p) { appendPhoto(p); });
  }

  /* 把标记从回复里摘干净（流式渲染时用，也用于喂回上下文） */
  function stripMarks(text) {
    return splitLinks(splitImages(text).body).body;
  }

  /* silent=true 时只做检查，不往聊天里插气泡（给「测试连接」用）；
     probe 只在测试时用，作为一次性用户消息发给模型，不进历史。
     正常发消息时，玩家那句话已经先写进 history 了，这里只传 null。 */
  function requestReply(silent, probe) {
    var cfg = config;
    var myId = ++reqSeq;
    var ctl = new AbortController();
    var toMs = Math.max(5, parseInt(cfg.timeout, 10) || 90) * 1000;
    var timer = setTimeout(function() { ctl.abort(); }, toMs);
    var streamed = '';

    var sys = String(cfg.sys || '').trim() || DEFAULT_SYS;
    var msgs = [{ role: 'system', content: sys }].concat(buildContext(tailTurns()));
    if (probe) msgs.push({ role: 'user', content: probe });

    var payload = {
      model: String(cfg.model || '').trim(),
      messages: msgs,
      stream: !!cfg.stream
    };
    var t = parseFloat(cfg.temp);
    if (!isNaN(t)) payload.temperature = Math.min(2, Math.max(0, t));
    var mt = parseInt(cfg.maxTok, 10);
    if (!isNaN(mt) && mt > 0) payload.max_tokens = mt;

    var url = endpointOf(cfg);
    var headers = { 'Content-Type': 'application/json' };
    if (String(cfg.key).trim()) headers['Authorization'] = 'Bearer ' + String(cfg.key).trim();

    return fetch(url, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(payload),
      signal: ctl.signal
    }).then(function(res) {
      if (!res.ok) {
        return res.text().then(function(b) { throw new Error(explain(res, b)); });
      }
      /* --- 非流式 --- */
      if (!cfg.stream || !res.body || !res.body.getReader) {
        return res.json().then(function(j) {
          var m = j.choices && j.choices[0] && j.choices[0].message;
          var txt = m ? (m.content || '') : '';
          if (!txt || !String(txt).trim()) throw new Error('模型返回了空内容。');
          if (!silent) finishReply(String(txt).trim(), myId);
          return String(txt).trim();
        });
      }
      /* --- 流式 --- */
      var reader = res.body.getReader();
      var dec = new TextDecoder('utf-8');
      var buf = '';
      var liveBubble = null;
      if (!silent) { liveBubble = addMsg('', 'in', false, false, null, true); }

      function paint() {
        if (!liveBubble) return;
        /* 流式过程中也把标记藏起来，别让半截标记闪出来 */
        liveBubble.textContent = stripMarks(streamed);
        scrollToBottom();
      }
      function pump() {
        return reader.read().then(function(r) {
          if (r.done) return;
          buf += dec.decode(r.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf('\n')) >= 0) {
            var line = buf.slice(0, idx).replace(/\r$/, '');
            buf = buf.slice(idx + 1);
            if (line.indexOf('data:') !== 0) continue;
            var data = line.slice(5).trim();
            if (data === '[DONE]') continue;
            try {
              var j = JSON.parse(data);
              var ch = j.choices && j.choices[0];
              if (!ch) continue;
              var piece = (ch.delta && (ch.delta.content || ch.delta.reasoning_content)) ||
                          (ch.message && ch.message.content) || '';
              if (piece) { streamed += piece; paint(); }
            } catch (e) { /* 半截 JSON，等下一块 */ }
          }
          return pump();
        });
      }
      return pump().then(function() {
        var out = String(streamed).trim();
        if (!out) {
          /* 一个字都没收到：把空气泡收掉，让错误提示占据它的位置 */
          if (liveBubble && liveBubble.parentNode && liveBubble.parentNode.parentNode) {
            liveBubble.parentNode.parentNode.removeChild(liveBubble.parentNode);
          }
          throw new Error('模型返回了空内容。');
        }
        if (!silent) settleStream(liveBubble, out, myId);
        return out;
      });
    }).then(function(txt) {
      clearTimeout(timer);
      if (silent) return { ok: true, text: txt };
      if (myId === reqSeq) { isProcessing = false; }
      return { ok: true, text: txt };
    })['catch'](function(err) {
      clearTimeout(timer);
      if (silent) return { ok: false, text: (err && err.message) || String(err) };
      if (myId !== reqSeq) return { ok: false, text: '已忽略过期的回复。' };
      isProcessing = false;
      var reason = (err && err.name === 'AbortError')
        ? '请求超时（超过 ' + (parseInt(cfg.timeout, 10) || 90) + ' 秒还没回应）。'
        : ((err && err.message) || String(err));
      killTyping();
      var b = addNote('⚠ ' + reason + '\n\n（检查一下 ⚙ 里的接口地址、模型名和 API Key；' +
                      '如果填的都对，多半是服务端没开跨域 CORS，浏览器不允许网页直接请求它。）', 'error');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'retry-btn';
      btn.textContent = '重试';
      btn.addEventListener('click', function() {
        if (isProcessing) return;
        isProcessing = true;
        requestReply(false);
      });
      b.appendChild(btn);
      if (myId === reqSeq) isProcessing = false;
      return { ok: false, text: reason };
    });
  }

  function finishReply(text, myId) {
    if (myId !== reqSeq) return;
    killTyping();
    renderReply(text);                 // 正文 + 可能带的图片 / 链接卡片
  }

  /* 把已经画在屏幕上的那个气泡「定稿」：补上 AI 标记并写进历史。
     流式输出用它落库，避免同一段回复被画两遍。回复里带图片 / 链接标记时，
     把标记从正文里摘掉，另画成图片气泡和卡片。 */
  function settleStream(el, rawText, myId) {
    if (myId !== reqSeq) return;
    var imgs = splitImages(rawText);
    var r = splitLinks(imgs.body);
    killTyping();
    if (!el || !el.parentNode) { renderReply(rawText); return; }
    el.textContent = r.body;
    if (config.badge) el.classList.add('ai-reply');
    history.push({ kind: 'msg', text: r.body, type: 'in', auto: false, ai: true,
                   link: null, time: timeStr() });
    saveThread();
    r.links.forEach(function (l) { addLinkCard(l.label, { url: l.url }, true); });
    imgs.pics.forEach(function (p) { appendPhoto(p); });
    scrollToBottom();
  }

  /* ============================================================ 发送 */
  /* 发文字：先把玩家这句话写进历史，再请求回复 */
  function handleSend() {
    if (isProcessing || input.disabled) return;
    var text = input.value.trim();
    if (!text) return;
    if (!cfgReady(config)) {
      addNote('⚠ 还没配置 AI 接入，先点 ⚙ 填好接口地址、模型名和 API Key。', 'error');
      openCfg();
      return;
    }
    addMsg(text, 'out', false, true, null, false);
    input.value = '';
    dispatchReply();
  }

  /* 请求一次回复。图片这种「没有新文字」的场合也一样：图片已经作为一条
     img 记录写进历史了，buildContext 会把它变成带图的那个 user 回合。 */
  function dispatchReply() {
    if (isProcessing) return;
    isProcessing = true;
    var removeTyping = config.stream ? function() {} : addTyping();
    requestReply(false).then(function () {
      removeTyping();
      isProcessing = false;
    }, function () {
      removeTyping();
      isProcessing = false;
    });
  }

  function renderHistory() {
    resetStamps();
    history.forEach(function(entry) {
      if (entry.kind === 'link') {
        addLinkCard(entry.label, { url: entry.url, alert: entry.alert }, false);
      } else if (entry.kind === 'img') {
        addImage(entry.src, entry.type, false, entry.mime, entry.more, entry.label);
      } else {
        addMsg(entry.text, entry.type, entry.auto, false, entry.link || null, entry.ai);
      }
    });
  }

  window.clearHistory = function() {
    if (!confirm('确定清空所有聊天记录吗？')) return;
    reqSeq++;                       // 丢弃在途请求
    isProcessing = false;
    try { localStorage.removeItem(THREAD_KEY); } catch (e) {}
    history = [];
    container.innerHTML = '';
    input.disabled = true;
    playInitialMessages();
  };

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', function(e) { if (e.key === 'Enter') handleSend(); });


  /* ============================================================ 设置窗口 UI */
  var panel    = document.getElementById('cfgPanel');
  var head     = document.getElementById('cfgHead');
  var elBase   = document.getElementById('cfgBase');
  var elModel  = document.getElementById('cfgModel');
  var elKey    = document.getElementById('cfgKey');
  var elTemp   = document.getElementById('cfgTemp');
  var elStream = document.getElementById('cfgStream');
  var elBadge  = document.getElementById('cfgBadge');
  var elSys    = document.getElementById('cfgSys');
  var elMaxTok = document.getElementById('cfgMaxTok');
  var elHist   = document.getElementById('cfgHist');
  var elTo     = document.getElementById('cfgTimeout');
  var elStatus = document.getElementById('cfgStatus');
  var adv      = document.getElementById('cfgAdv');
  var gearTop  = document.getElementById('cfgBtnTop');
  var gearBot  = document.getElementById('cfgBtnBottom');
  var POS_KEY  = 'lbyz_ai_cfg_pos';

  function setStatus(text, kind) {
    elStatus.textContent = text || '';
    elStatus.className = 'cfg-status' + (kind ? ' ' + kind : '');
  }

  function fillForm(c) {
    elBase.value   = c.base;
    elModel.value  = c.model;
    elKey.value    = c.key;
    elTemp.value   = c.temp;
    elStream.checked = !!c.stream;
    elBadge.checked  = !!c.badge;
    elSys.value    = c.sys || DEFAULT_SYS;
    elMaxTok.value = (c.maxTok === '' || c.maxTok === null || c.maxTok === undefined) ? '' : c.maxTok;
    elHist.value   = c.hist;
    elTo.value     = c.timeout;
  }
  function readForm() {
    return {
      base:   elBase.value.trim(),
      model:  elModel.value.trim(),
      key:    elKey.value.trim(),
      temp:   elTemp.value === '' ? DEFAULTS.temp : parseFloat(elTemp.value),
      stream: elStream.checked,
      badge:  elBadge.checked,
      sys:    elSys.value.trim() || DEFAULT_SYS,
      maxTok: elMaxTok.value.trim(),
      hist:   elHist.value === '' ? DEFAULTS.hist : (parseInt(elHist.value, 10) || 0),
      timeout: elTo.value === '' ? DEFAULTS.timeout : (parseInt(elTo.value, 10) || DEFAULTS.timeout)
    };
  }

  function refreshStatus() {
    if (cfgReady(config)) {
      statusEl.textContent = 'lbyz 在线 · AI：' + config.model;
      gearTop.classList.remove('attention');
      gearBot.classList.remove('attention');
    } else {
      statusEl.textContent = 'lbyz 在线 · AI 未接入';
      gearTop.classList.add('attention');
      gearBot.classList.add('attention');
    }
  }

  function openCfg() {
    fillForm(config);
    setStatus('');
    panel.classList.add('show');
    placePanel();
    setTimeout(function() { elBase.focus(); }, 60);
  }
  function closeCfg() {
    panel.classList.remove('show');
    if (!cfgReady(config)) {
      input.placeholder = '先在 ⚙ 里填好接口和 API Key…';
    } else if (!input.disabled) {
      input.placeholder = '输入消息...';
    }
  }

  /* 窗口位置：默认右上角，拖动后记住 */
  function placePanel() {
    var p = null;
    try { p = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); } catch (e) {}
    if (p && typeof p.left === 'number' && typeof p.top === 'number') {
      panel.style.left = clamp(p.left, 4, window.innerWidth  - panel.offsetWidth  - 4) + 'px';
      panel.style.top  = clamp(p.top,  4, window.innerHeight - panel.offsetHeight - 4) + 'px';
    } else {
      panel.style.left = Math.max(8, (window.innerWidth - panel.offsetWidth) / 2) + 'px';
      panel.style.top  = '40px';
    }
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  (function makeDraggable() {
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    head.addEventListener('mousedown', function(e) {
      if (e.target.tagName === 'BUTTON') return;
      dragging = true;
      sx = e.clientX; sy = e.clientY;
      ox = panel.offsetLeft; oy = panel.offsetTop;
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      panel.style.left = clamp(ox + e.clientX - sx, 4, window.innerWidth  - panel.offsetWidth  - 4) + 'px';
      panel.style.top  = clamp(oy + e.clientY - sy, 4, window.innerHeight - panel.offsetHeight - 4) + 'px';
    });
    document.addEventListener('mouseup', function() {
      if (!dragging) return;
      dragging = false;
      try { localStorage.setItem(POS_KEY, JSON.stringify({ left: panel.offsetLeft, top: panel.offsetTop })); } catch (e) {}
    });
    /* 触屏也支持拖 */
    head.addEventListener('touchstart', function(e) {
      if (e.target.tagName === 'BUTTON') return;
      var t = e.touches[0];
      sx = t.clientX; sy = t.clientY; ox = panel.offsetLeft; oy = panel.offsetTop; dragging = true;
    }, { passive: true });
    document.addEventListener('touchmove', function(e) {
      if (!dragging) return;
      var t = e.touches[0];
      panel.style.left = clamp(ox + t.clientX - sx, 4, window.innerWidth  - panel.offsetWidth  - 4) + 'px';
      panel.style.top  = clamp(oy + t.clientY - sy, 4, window.innerHeight - panel.offsetHeight - 4) + 'px';
    }, { passive: true });
    document.addEventListener('touchend', function() { dragging = false; });
  })();

  gearTop.addEventListener('click', function() { panel.classList.contains('show') ? closeCfg() : openCfg(); });
  gearBot.addEventListener('click', function() { panel.classList.contains('show') ? closeCfg() : openCfg(); });
  document.getElementById('cfgClose').addEventListener('click', closeCfg);

  document.getElementById('cfgEye').addEventListener('click', function() {
    var on = elKey.type === 'password';
    elKey.type = on ? 'text' : 'password';
    this.textContent = on ? '隐藏' : '显示';
  });

  document.getElementById('cfgAdvToggle').addEventListener('click', function() {
    adv.classList.toggle('show');
    this.textContent = adv.classList.contains('show')
      ? '收起高级设置'
      : '高级设置（系统提示词 / 生成参数）';
  });

  document.getElementById('cfgSysReset').addEventListener('click', function() {
    if (!confirm('把系统提示词恢复成默认的刘天清设定？')) return;
    elSys.value = DEFAULT_SYS;
  });

  document.getElementById('cfgSave').addEventListener('click', function() {
    var f = readForm();
    if (!f.base || !f.model) {
      setStatus('接口地址和模型名都要填。', 'err');
      return;
    }
    if (!f.key) {
      setStatus('API Key 还没有填。', 'err');
      return;
    }
    config = f;
    saveCfg(config);
    setStatus('已保存。', 'ok');
    refreshStatus();
    if (!input.disabled || cfgReady(config)) {
      var pending = input.value;
      input.disabled = false;
      input.placeholder = '输入消息...';
      input.value = pending;
      input.focus();
    }
    setTimeout(closeCfg, 500);
  });

  document.getElementById('cfgTest').addEventListener('click', function() {
    var f = readForm();
    if (!f.base || !f.model || !f.key) {
      setStatus('测试前请先把接口地址、模型名、API Key 都填上。', 'err');
      return;
    }
    var saved = config;
    config = f;                       // 用表单里的值试，但不写入 localStorage
    setStatus('正在连接…', 'wait');
    requestReply(true, '在吗？随便回我一句就行。').then(function(r) {
      config = saved;
      if (r.ok) {
        var s = String(r.text).replace(/\s+/g, ' ').slice(0, 60);
        setStatus('连上了 ✓ 模型回了：' + s, 'ok');
      } else {
        setStatus('没连上：' + r.text, 'err');
      }
    })['catch'](function(e) {
      config = saved;
      setStatus('没连上：' + ((e && e.message) || e), 'err');
    });
  });

  document.getElementById('cfgClear').addEventListener('click', function() {
    if (!confirm('清除本机保存的接口地址、模型名和 API Key？')) return;
    try { localStorage.removeItem(CFG_KEY); } catch (e) {}
    config = loadCfg();
    fillForm(config);
    setStatus('已清除配置。', 'ok');
    refreshStatus();
  });

  /* 鼠标点击面板外面不关闭（避免误触丢掉填了一半的表单），只按 × 或再点 ⚙ */

  /* ============================================================ 启动 */
  setAvatar(document.getElementById('headerAvatar'), 'in');
  refreshStatus();
  fillForm(config);
  window.addEventListener('resize', function() {
    if (!panel.classList.contains('show')) return;
    panel.style.left = clamp(panel.offsetLeft, 4, window.innerWidth  - panel.offsetWidth  - 4) + 'px';
    panel.style.top  = clamp(panel.offsetTop,  4, window.innerHeight - panel.offsetHeight - 4) + 'px';
  });

  if (history.length > 0) {
    renderHistory();
    if (!cfgReady(config)) {
      input.disabled = true;
      input.placeholder = '先在 ⚙ 里填好接口和 API Key…';
    } else {
      input.disabled = false;
      input.focus();
    }
  } else {
    input.disabled = true;
    playInitialMessages();
  }

  /* 第一次进来（没配过 AI）自动把设置窗口打开，方便直接填 */
  var SEEN_KEY = 'lbyz_ai_cfg_seen';
  var seen = null;
  try { seen = localStorage.getItem(SEEN_KEY); } catch (e) {}
  if (!seen) {
    openCfg();
    try { localStorage.setItem(SEEN_KEY, '1'); } catch (e) {}
  }
})();
</script>
</body>
</html>
