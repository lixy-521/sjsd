<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山经书店 · 我是谁</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  background: #0d0d0d;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.bg-particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
  animation: float linear infinite;
}
@keyframes float {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}
.container {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 40px 20px;
  max-width: 520px;
  width: 100%;
}
.question {
  font-size: clamp(48px, 10vw, 96px);
  font-weight: 300;
  color: rgba(255,255,255,0.9);
  letter-spacing: 12px;
  margin-bottom: 8px;
  text-shadow: 0 0 60px rgba(255,255,255,0.05);
}
.question-sub {
  font-size: 16px;
  color: rgba(255,255,255,0.25);
  letter-spacing: 6px;
  margin-bottom: 48px;
  font-weight: 300;
}
.search-box {
  display: flex;
  align-items: center;
  max-width: 400px;
  margin: 0 auto;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 40px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(8px);
  transition: border-color .3s, box-shadow .3s;
  overflow: hidden;
}
.search-box:focus-within {
  border-color: rgba(255,255,255,0.35);
  box-shadow: 0 0 30px rgba(255,255,255,0.04);
}
.search-box input {
  flex: 1;
  padding: 16px 24px;
  background: transparent;
  border: none;
  outline: none;
  font-size: 16px;
  color: rgba(255,255,255,0.85);
  font-family: inherit;
  letter-spacing: 2px;
}
.search-box input::placeholder {
  color: rgba(255,255,255,0.2);
  letter-spacing: 1px;
}
.search-box button {
  padding: 16px 28px;
  background: transparent;
  border: none;
  border-left: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.4);
  font-size: 18px;
  cursor: pointer;
  transition: color .2s, background .2s;
  font-family: inherit;
}
.search-box button:hover {
  color: rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.05);
}
.hint {
  margin-top: 28px;
  font-size: 13px;
  color: rgba(255,255,255,0.15);
  letter-spacing: 2px;
}
.error-msg {
  margin-top: 16px;
  font-size: 14px;
  color: rgba(255,80,80,0.6);
  letter-spacing: 1px;
  min-height: 24px;
  transition: opacity .3s;
}
.cursor-blink {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background: rgba(255,255,255,0.3);
  margin-left: 2px;
  animation: blink 1s step-end infinite;
  vertical-align: text-bottom;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
@media (max-width: 480px) {
  .question { letter-spacing: 6px; }
  .question-sub { letter-spacing: 3px; }
}
</style>
</head>
<body>
<div class="bg-particles" id="particles"></div>
<div class="container">
  <div class="question">我是谁</div>
  <div class="question-sub">山 经 书 店</div>
  <div class="search-box">
    <input type="text" id="nameInput" placeholder="输入一个名字..." autocomplete="off" spellcheck="false">
    <button id="searchBtn">→</button>
  </div>
  <div class="error-msg" id="errorMsg"></div>
</div>
<script>
(function() {
  const input = document.getElementById('nameInput');
  const btn = document.getElementById('searchBtn');
  const error = document.getElementById('errorMsg');

  function handleSubmit() {
    const val = input.value.trim();
    if (!val) {
      error.textContent = '请输入一个名字';
      return;
    }
    if (val === '董鑫') {
      window.location.href = 'diary-white.html';
    } else if (val === '董新飞') {
      window.location.href = 'truth-black.html';
    } else {
      error.textContent = '这个名字没有记录';
      input.value = '';
      input.focus();
    }
  }

  btn.addEventListener('click', handleSubmit);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleSubmit();
  });
  input.addEventListener('input', function() {
    error.textContent = '';
  });
  input.focus();

  // Particles
  const container = document.getElementById('particles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
    container.appendChild(p);
  }
})();
</script>
</body>
</html>
