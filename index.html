<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lbyz · 校园即时通讯</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* 配色变量：沿用本项目原有的蓝灰体系 */
:root {
  --brand:      #2d5a8a;
  --brand-dark: #1a3a5c;
  --brand-soft: #eaf3ff;
  --brand-soft-hover: #dce8f8;
  --brand-disabled: #b9cde0;
  --gutter: 14px;   /* 头像与窗口边缘之间的距离 */
}
body {
  font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  background: #e8ecf0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}
.chat-app {
  width: 820px;
  max-width: 100%;
  height: 92vh;
  max-height: 900px;
  min-height: 520px;
  background: #fff;
  border-radius: 6px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.chat-header {
  background: linear-gradient(135deg, #1a3a5c, #2d5a8a);
  color: #fff;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.chat-header .avatar {
  width: 38px;
  height: 38px;
  border-radius: 4px;
  overflow: hidden;
  background: #e8ecf1;
  display: block;
  flex-shrink: 0;
}
.chat-header .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
.chat-header .chat-info { flex: 1; }
.chat-header .chat-info .name { font-size: 15px; font-weight: 600; letter-spacing: 1px; }
.chat-header .chat-info .status {
  font-size: 11px;
  opacity: 0.6;
  margin-top: 2px;
}
.chat-header .header-actions { display: flex; gap: 6px; }
.chat-header .header-actions button {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  width: 34px;
  height: 34px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s;
}
.chat-header .header-actions button:hover { background: rgba(255,255,255,0.2); }
/* 会话区：左右由各消息行自行留出边距，头像不贴窗口边缘 */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 0 10px;
  background: #f5f7fa;
}
.chat-inner {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.msg-row {
  display: flex;
  gap: 10px;
  max-width: 86%;
  align-items: center;          /* 头像与气泡垂直居中对齐 */
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .3s, transform .3s;
}
.msg-row.visible { opacity: 1; transform: translateY(0); }
.msg-row.incoming { align-self: flex-start; padding-right: 16px; padding-left: var(--gutter); }
.msg-row.outgoing { align-self: flex-end; flex-direction: row-reverse; padding-left: 16px; padding-right: var(--gutter); }
/* 头像：方形圆角，距窗口边缘留一段小距离，用图片占位 */
.msg-avatar {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border-radius: 5px;
  overflow: hidden;
  background: #e8ecf1;
  display: block;
}
.msg-avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
/* 气泡：圆角偏大，指向头像的那一角收成尖角 */
.msg-bubble {
  position: relative;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}
.msg-row.incoming .msg-bubble {
  background: #fff;
  color: #333;
  border-bottom-left-radius: 0;
}
.msg-row.outgoing .msg-bubble {
  background: var(--brand);
  color: #fff;
  border-bottom-right-radius: 0;
}
/* 气泡小尖角，贴在底部指向头像一侧 */
.msg-row.incoming .msg-bubble::before {
  content: '';
  position: absolute;
  left: -6px;
  bottom: 0;
  width: 12px;
  height: 12px;
  background: inherit;
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
}
.msg-row.outgoing .msg-bubble::before {
  content: '';
  position: absolute;
  right: -6px;
  bottom: 0;
  width: 12px;
  height: 12px;
  background: inherit;
  clip-path: polygon(0 0, 100% 100%, 0 100%);
}
/* 自动回复：仍是灰底小黑字，与真人发言区分 */
.msg-row .msg-bubble.auto-reply {
  background: #f0f0f0;
  color: #666;
  font-size: 13px;
}
.msg-row .msg-bubble.link-card {
  display: inline-block;
  background: var(--brand-soft);
  color: var(--brand);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  text-align: left;
  text-decoration: none;
  border: none;
  border-left: 3px solid var(--brand);
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.msg-row .msg-bubble.link-card:hover { background: var(--brand-soft-hover); color: var(--brand-dark); text-decoration: none; }
/* 新标签页打开的外部页面卡片：加一个小箭头提示 */
.msg-row a.msg-bubble.link-card { padding-right: 30px; position: relative; }
.msg-row a.msg-bubble.link-card::after {
  content: '↗';
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  font-weight: 400;
  opacity: .5;
}
.msg-row .msg-bubble.img-bubble {
  padding: 4px;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.msg-bubble.img-bubble img {
  display: block;
  width: 240px;
  max-width: 100%;
  border-radius: 4px;
  cursor: zoom-in;
}
/* 点击图片放大查看 */
.img-viewer {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.78);
  cursor: zoom-out;
  padding: 24px;
  box-sizing: border-box;
}
.img-viewer.show { display: flex; }
.img-viewer img {
  max-width: 92vw;
  max-height: 92vh;
  border-radius: 6px;
  box-shadow: 0 8px 40px rgba(0,0,0,.5);
  cursor: default;
}
.img-viewer .viewer-close {
  position: absolute;
  top: 16px;
  right: 20px;
  width: 36px;
  height: 36px;
  line-height: 34px;
  text-align: center;
  font-size: 22px;
  color: #fff;
  background: rgba(255,255,255,.14);
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  padding: 0;
}
.img-viewer .viewer-close:hover { background: rgba(255,255,255,.28); }
/* 时间戳：居中显示的浅灰底小字 */
.msg-stamp {
  align-self: center;
  margin: 4px 0 6px;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(0,0,0,0.055);
  font-size: 11.5px;
  line-height: 1.5;
  color: #999;
  letter-spacing: .5px;
}
.chat-input-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 14px 14px;
  border-top: 1px solid #e8e8e8;
  background: #fff;
  flex-shrink: 0;
}
.chat-input-area input {
  flex: 1 1 auto;
  min-width: 0;
  max-width: 660px;
  padding: 10px 14px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
  font-family: inherit;
  background: #f5f7fa;
}
.chat-input-area input:focus { border-color: var(--brand); background: #fff; }
.chat-input-area .send-btn {
  min-width: 64px;
  height: 40px;
  padding: 0 16px;
  background: var(--brand);
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 14px;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background .2s, transform .1s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.chat-input-area .send-btn:hover { background: var(--brand-dark); }
.chat-input-area .send-btn:active { transform: scale(.96); }
.chat-input-area .send-btn:disabled { background: var(--brand-disabled); cursor: default; }
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

/* 窄屏：窗口收窄，保持头像边距 */
@media (max-width: 900px) {
  body { padding: 8px; }
  .chat-app { height: 96vh; max-height: none; border-radius: 5px; }
  .msg-row { max-width: 92%; }
  .msg-bubble.img-bubble img { width: 200px; }
}
@media (max-width: 560px) {
  body { padding: 0; }
  .chat-app { height: 100vh; border-radius: 0; box-shadow: none; }
  .chat-header { padding: 12px 14px; }
  .chat-input-area { padding: 10px 12px; }
}
</style>
</head>
<body>
<div class="chat-app">
  <div class="chat-header">
    <div class="avatar" id="headerAvatar"></div>
    <div class="chat-info">
      <div class="name">刘天清（刘哥）</div>
      <div class="status">lbyz 在线</div>
    </div>
    <div class="header-actions">
      <button title="清空记录" onclick="clearHistory()" style="font-size:13px;">🗑</button>
      <button title="回到最新消息" onclick="scrollToBottom()">↓</button>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="chat-inner" id="chatInner"></div>
  </div>

  <div class="chat-input-area">
    <input type="text" id="msgInput" placeholder="输入消息..." autocomplete="off" spellcheck="false">
    <button class="send-btn" id="sendBtn">发送</button>
  </div>
</div>

<!-- 图片放大查看 -->
<div class="img-viewer" id="imgViewer">
  <img id="imgViewerPic" src="" alt="图片">
  <button type="button" class="viewer-close" id="imgViewerClose" aria-label="关闭">×</button>
</div>

<script>
(function() {
  const scrollBox = document.getElementById('chatMessages');
  const container = document.getElementById('chatInner');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  let isProcessing = false;

  /* --------------------------------------------------- 图片放大查看
     点气泡里的图片放大；再点任意处或按 Esc 关闭。 */
  const viewer = document.getElementById('imgViewer');
  const viewerPic = document.getElementById('imgViewerPic');
  function openViewer(src, alt) {
    viewerPic.src = src;
    viewerPic.alt = alt || '图片';
    viewer.classList.add('show');
  }
  function closeViewer() {
    viewer.classList.remove('show');
    viewerPic.src = '';
  }
  container.addEventListener('click', function (e) {
    const img = e.target.closest('.msg-bubble.img-bubble img');
    if (img) openViewer(img.src, img.alt);
  });
  viewer.addEventListener('click', closeViewer);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && viewer.classList.contains('show')) closeViewer();
  });

  const STORAGE_KEY = 'lbyz_chat_history_v2';
  let history = loadHistory();

  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) {}
  }

  // 占位头像：换图时直接覆盖同名文件即可
  const AVATAR = {
    in:  { src: 'assets/avatar-liu.png', alt: '刘天清' },
    out: { src: 'assets/avatar-li.png',  alt: '李令炉' }
  };

  function makeAvatar(type) {
    const el = document.createElement('div');
    el.className = 'msg-avatar';
    const im = document.createElement('img');
    im.src = AVATAR[type].src;
    im.alt = AVATAR[type].alt;
    el.appendChild(im);
    return el;
  }

  function setAvatar(el, type) {
    el.textContent = '';
    const im = document.createElement('img');
    im.src = AVATAR[type].src;
    im.alt = AVATAR[type].alt;
    el.appendChild(im);
  }

  // 开场消息（蒂中帝原文保留，不改动）
  const messages = [
    { img: 'assets/mx1.png', type: 'out' },
    { text: '你看看这个书店，有点nb啊', type: 'out' },
    { text: '卧槽', type: 'in' },
    { text: '李令炉', type: 'in' },
    { text: '你是怀璧的啊', type: 'in' },
    { text: '现在我这边查到董新飞可能跑到怀璧了，需要一个人调查一下。', type: 'in' },
    { text: '现在家长非得让我来这个弟中之弟机构封闭补习，现在不能随便用手机。', type: 'in' },
    { text: '我设了一个脚本自动回复你，后面调查就靠你了', type: 'in' },
    { text: '现在可以告诉你已经查到了3个网页[1][2][3]', type: 'in' },
    { text: '羊村市那个"蒂中帝"教育？听说特别牢啊。', type: 'out' },
    { text: '刘天清的回复小助手：未查询到相关的内容。发送调查相关关键词可以获得更多情报。', type: 'in', auto: true },
    { text: '刘哥你有病啊，直接把所有情报给我不就得了', type: 'out' },
    { text: '刘天清的回复小助手：未查询到相关的内容。发送调查相关关键词可以获得更多情报。', type: 'in', auto: true }
  ];

  const LINK_INDEX = 8; // 3个网页链接插在"现在可以告诉你…"之后、"羊村市那个蒂中帝…"之前（含首条图片，故为 8）

  const linkPages = [
    { label: '[1] 论坛帖子：蜜雪员工吐槽 + HBYZ老师名单', url: 'forum/post-1.html' },
    { label: '[2] 新闻报道：山经书店开业，店员程加春受访', url: 'news/opening.html' },
    { label: '[3] 公众号文章：山经书店盛大开业！', url: 'https://mp.weixin.qq.com/s/ppy6ssqktADWf2HS9bmYDQ' }
  ];

  function scrollToBottom() {
    setTimeout(() => { scrollBox.scrollTop = scrollBox.scrollHeight; }, 50);
  }

  function timeStr() {
    const now = new Date();
    return String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  }

  let lastStampAt = 0;   // 上一条时间戳（毫秒），用于按间隔显示
  let stampCount = 0;

  /* 时间分隔：只在间隔较久时显示一次 */
  function addStamp(force) {
    const now = Date.now();
    const first = stampCount === 0;
    if (!force && !first && (now - lastStampAt) < 5 * 60 * 1000) return;
    lastStampAt = now;
    stampCount++;
    const el = document.createElement('div');
    el.className = 'msg-stamp';
    el.textContent = timeStr();
    container.appendChild(el);
  }

  function resetStamps() {
    lastStampAt = 0;
    stampCount = 0;
  }

  function addMsg(text, type, auto, persist, link) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (type === 'out' ? 'outgoing' : 'incoming');

    const avatar = makeAvatar(type);

    const wrap = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble' + (auto ? ' auto-reply' : '');
    if (link) {
      bubble.appendChild(document.createTextNode(text));
      const a = document.createElement('a');
      a.textContent = link.label;
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.cssText = 'color:#0b5d34;font-weight:700;text-decoration:underline;';
      bubble.appendChild(a);
    } else {
      bubble.textContent = text;
    }

    wrap.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(wrap);
    addStamp();
    container.appendChild(row);

    if (persist) {
      history.push({ kind: 'msg', text: text, type: type, auto: !!auto, link: link || null, time: timeStr() });
      saveHistory();
    }

    row.classList.add('visible');
    scrollToBottom();
  }

  function addImage(src, type, persist) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (type === 'out' ? 'outgoing' : 'incoming');

    const avatar = makeAvatar(type);

    const wrap = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble img-bubble';
    const img = document.createElement('img');
    img.src = src;
    img.alt = '图片';
    bubble.appendChild(img);

    wrap.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(wrap);
    addStamp();
    container.appendChild(row);

    if (persist) {
      history.push({ kind: 'img', src: src, type: type, time: timeStr() });
      saveHistory();
    }

    row.classList.add('visible');
    scrollToBottom();
  }

  function addLinkCard(label, target, persist) {
    const row = document.createElement('div');
    row.className = 'msg-row incoming';

    const avatar = makeAvatar('in');

    const wrap = document.createElement('div');

    /* 有网址的卡片渲染成真正的 <a>，在新标签页打开；
       仅用于弹提示的卡片保持按钮语义 */
    let bubble, node;
    if (target.url) {
      bubble = document.createElement('a');
      bubble.href = target.url;
      bubble.target = '_blank';
      bubble.rel = 'noopener noreferrer';
      node = bubble;
    } else {
      bubble = document.createElement('button');
      bubble.type = 'button';
      bubble.addEventListener('click', function() {
        if (target.alert) alert(target.alert);
      });
      node = bubble;
    }
    bubble.className = 'msg-bubble link-card';
    bubble.textContent = label;
    node.setAttribute('title', target.url ? '在新标签页中打开' : '查看提示');

    wrap.appendChild(node);
    row.appendChild(avatar);
    row.appendChild(wrap);
    addStamp();
    container.appendChild(row);

    if (persist) {
      history.push({ kind: 'link', label: label, url: target.url || null, alert: target.alert || null, time: timeStr() });
      saveHistory();
    }

    row.classList.add('visible');
    scrollToBottom();
  }

  // 消息之间的停顿（不再显示“正在输入”动画）
  function pause(callback) {
    setTimeout(function() {
      if (callback) callback();
    }, 400 + Math.random() * 600);
  }

  // 构建线性播放队列：消息 + 链接卡片按顺序排好，只按 index 推进，杜绝循环
  function buildQueue() {
    const queue = [];
    for (let i = 0; i < messages.length; i++) {
      if (i === LINK_INDEX) {
        linkPages.forEach(function(p) {
          queue.push({ kind: 'link', page: p });
        });
      }
      queue.push({ kind: 'msg', msg: messages[i] });
    }
    return queue;
  }

  function playQueue(index) {
    if (index >= queue.length) {
      input.disabled = false;
      input.focus();
      return;
    }
    const item = queue[index];
    if (item.kind === 'link') {
      pause(function() {
        addLinkCard(item.page.label, item.page, true);
        setTimeout(function() {
          playQueue(index + 1);
        }, 500 + Math.random() * 400);
      });
    } else {
      pause(function() {
        if (item.msg.img) {
          addImage(item.msg.img, item.msg.type, true);
        } else {
          addMsg(item.msg.text, item.msg.type, item.msg.auto || false, true, item.msg.link || null);
        }
        setTimeout(function() {
          playQueue(index + 1);
        }, 400 + Math.random() * 300);
      });
    }
  }

  // 首次播放：生成一次队列，之后只推进，绝不回头
  const queue = buildQueue();
  function playInitialMessages() {
    resetStamps();
    playQueue(0);
  }

  const keywordResponses = {
    '牢董': '董新飞，42岁，前狼堡技术员。\n以教辅书店为掩护，化名"董鑫"。\n目的：为儿子留学筹款80万/年。',
    '董新飞': '董新飞，42岁，前狼堡技术员。\n以教辅书店为掩护，化名"董鑫"。\n目的：为儿子留学筹款80万/年。',
    '技术': '技术来源：北境神经科学研究院。\n非侵入式脑波采集 + 音频同步。\n提取设备为狼堡时期改良版。\n以"学习能力评估"为名，实际提取认知数据。',
    '小程序': '你想知道小程序在哪,直接在公众号里面问就行。',
    '认知强化': '我去查了他们的公众号。\n你去公众号发两个字试试："合作"。\n（他们说那是给合作老师留的口子。）',
    '认知强化服务': '我去查了他们的公众号。\n你去公众号发两个字试试："合作"。\n（他们说那是给合作老师留的口子。）',

    const lowerText = text.toLowerCase();

    // 句中关键词匹配：只要句中出现关键词即回复（长词优先，避免被短词抢先）
    function findKeyword() {
      var keys = Object.keys(keywordResponses);
      keys.sort(function(a, b) { return b.length - a.length; });
      for (var i = 0; i < keys.length; i++) {
        if (text.indexOf(keys[i]) > -1) return keys[i];
      }
      return null;
    }
    const matched = findKeyword();

    if (text === '狼堡往事' || lowerText.includes('狼堡往事')) {
