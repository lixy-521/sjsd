<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>山经书店在线服务平台</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  background: #f0f2f5;
  color: #333;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px 12px;
}
.wrap {
  max-width: 640px;
  width: 100%;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 16px rgba(0,0,0,0.08);
}
.bar {
  background: linear-gradient(135deg, #1a3a5c, #2d5a8a);
  color: #fff;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.bar a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 13px; }
.bar a:hover { color: #fff; }
.bar .t { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: 1px; }
.banner {
  background: linear-gradient(135deg, #e8f0f8, #d4e2f0);
  padding: 28px 20px;
  text-align: center;
}
.banner h1 { font-size: 20px; color: #1a3a5c; letter-spacing: 3px; font-weight: 600; }
.banner p { font-size: 13px; color: #6a8aaa; margin-top: 6px; }
.nav-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 20px;
}
.nav-card {
  padding: 18px 14px;
  background: #f5f8fc;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  transition: background .2s, transform .1s;
  border: 1px solid transparent;
  display: block;
  text-decoration: none;
}
.nav-card:hover { background: #e8f0f8; border-color: #c0d4e8; transform: translateY(-2px); }
.nav-card .icon { font-size: 28px; margin-bottom: 6px; }
.nav-card .label { font-size: 14px; font-weight: 600; color: #333; }
.nav-card .desc { font-size: 11px; color: #999; margin-top: 4px; }

.section { padding: 20px; border-top: 1px solid #eee; }
.section h3 { font-size: 16px; color: #1a3a5c; margin-bottom: 12px; }
.student-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.student-item {
  padding: 8px 14px;
  background: #f5f8fc;
  border-radius: 20px;
  font-size: 13px;
  color: #444;
  cursor: pointer;
  transition: background .2s;
  text-decoration: none;
  border: none;
  font-family: inherit;
}
.student-item:hover { background: #e8f0f8; color: #1a3a5c; }
.student-item .badge {
  display: inline-block;
  font-size: 10px;
  background: #2d5a8a;
  color: #fff;
  padding: 1px 6px;
  border-radius: 10px;
  margin-left: 4px;
}
.foot {
  padding: 14px;
  text-align: center;
  font-size: 11px;
  color: #ccc;
  border-top: 1px solid #eee;
}
.hint-box {
  background: #fdf2f2;
  border: 1px solid #f0d0d0;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 12px;
  color: #888;
  line-height: 1.7;
}
.hint-box strong { color: #c0392b; }
.hint-box a { color: #c0392b; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a href="../index.html">←</a>
    <span class="t">山经书店 · 在线服务平台</span>
  </div>
  <div class="banner">
    <h1>山经书店在线服务平台</h1>
    <p>评估预约 · 报告下载 · 志愿者服务</p>
  </div>

  <div class="nav-grid">
    <a class="nav-card" href="booking.html">
      <div class="icon">📋</div>
      <div class="label">评估预约</div>
      <div class="desc">在线填写预约信息</div>
    </a>
    <a class="nav-card" href="report.html">
      <div class="icon">📄</div>
      <div class="label">报告下载</div>
      <div class="desc">查看评估报告</div>
    </a>
    <a class="nav-card" href="volunteer.html">
      <div class="icon">🤝</div>
      <div class="label">志愿者服务</div>
      <div class="desc">报名/奖励领取</div>
    </a>
    <button class="nav-card" id="studentsBtn" type="button">
      <div class="icon">⭐</div>
      <div class="label">优秀学员</div>
      <div class="desc">成功案例展示</div>
    </button>
  </div>

  <div class="section" id="studentSection">
    <h3>⭐ 优秀学员</h3>
    <div class="student-list" id="studentList">
      <a class="student-item" href="reports/wuhaobo.html">吴昊博</a>
      <a class="student-item" href="reports/liyangzilin.html">李杨梓麟</a>
      <a class="student-item" href="reports/wangyuhan.html">王宇涵</a>
      <a class="student-item" href="reports/linwan.html">林晚</a>
      <a class="student-item" href="reports/chenmuxun.html">陈牧循</a>
      <a class="student-item" href="reports/luojinming.html">罗晋铭</a>
    </div>
  </div>

  <div class="foot">山经书店在线服务平台 v1.2</div>
</div>

<script>
(function() {
  document.getElementById('studentsBtn').addEventListener('click', function() {
    document.getElementById('studentSection').scrollIntoView({ behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
