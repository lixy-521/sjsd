<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>服务查询 · 山经海集</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:#e9e9e9;color:#333}
a{text-decoration:none;color:inherit}
.phone{max-width:420px;min-height:100vh;margin:0 auto;background:#f5f5f5;position:relative;padding-bottom:70px;box-shadow:0 0 24px rgba(0,0,0,.06)}
.mp-nav{position:sticky;top:0;z-index:50;height:52px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 8px;gap:4px}
.mp-nav .back{min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:50%;color:#333}
.mp-nav .title{flex:1;text-align:center;font-size:16px;font-weight:600}
.capsule{display:flex;align-items:center;gap:7px;border:1px solid #e6e6e6;border-radius:16px;padding:5px 10px;background:#f7f7f7;font-size:14px;color:#555;line-height:1}
.capsule .dv{width:1px;height:14px;background:#e0e0e0}
.hero{background:linear-gradient(135deg,#2d5a8a,#4a86b8);color:#fff;margin:10px;border-radius:12px;padding:22px 18px;text-align:center}
.hero .ic{font-size:30px}
.hero h1{font-size:18px;font-weight:600;margin-top:8px}
.hero p{font-size:12px;opacity:.9;margin-top:6px}
.card{background:#fff;border-radius:12px;margin:10px;padding:16px}
.card .tx{font-size:13px;color:#555;line-height:1.9}
.field{display:flex;gap:8px;margin-top:14px}
.field input{flex:1;height:42px;border:1px solid #e2e2e2;border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit;outline:none;letter-spacing:1px;text-transform:uppercase}
.field input:focus{border-color:#07c160}
.field button{height:42px;padding:0 22px;border:none;background:#07c160;color:#fff;border-radius:8px;font-size:14px;font-family:inherit;cursor:pointer}
.msg{font-size:12px;margin-top:12px;min-height:16px;line-height:1.7}
.msg.err{color:#e54d42}
.msg.ok{color:#07934a}
.hint{background:#fffdf5;border:1px solid #f0e6c8;border-radius:12px;margin:10px;padding:14px}
.hint .ht{font-size:13px;font-weight:600;color:#a9821a;margin-bottom:6px}
.hint .hd{font-size:12px;color:#8a7a4a;line-height:1.9}
.hint .hd code{font-family:"Courier New",monospace;background:#f6f1e2;border-radius:3px;padding:0 4px;color:#8a6d1f}
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:420px;margin:0 auto;height:58px;background:#fff;border-top:1px solid #ececec;display:flex;z-index:60}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#999}
.tabbar a .ic{font-size:18px;line-height:1}
.tabbar a.active{color:#07c160}
</style>
</head>
<body>
<div class="phone">
  <header class="mp-nav">
    <a class="back" href="home.html" title="返回">←</a>
    <span class="title">服务入口</span>
    <span class="capsule">···<span class="dv"></span>⊙</span>
  </header>

  <div class="hero">
    <div class="ic">🔐</div>
    <h1>定向服务查询</h1>
    <p>输入服务ID查看</p>
  </div>

  <div class="card">
    <p class="tx">「认知强化服务」为定向邀请服务，不对外开放。请在下方的输入框中填写你的专属服务ID进行查询。</p>
    <div class="field">
      <input id="sid" type="text" placeholder="请输入服务ID" autocomplete="off" spellcheck="false">
      <button id="go" type="button">查询</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="hint">
    <div class="ht">💡 线索</div>
    <div class="hd">部分优秀学员的评估报告中，附有「认知强化服务」的链接，该链接内带有本人的服务ID。<br>提示：留意评估报告中的异常字段，形如 <code>XX-XX-2026xxxx</code>。</div>
  </div>

  <nav class="tabbar">
    <a href="home.html"><span class="ic">🏠</span>首页</a>
    <a href="category.html"><span class="ic">📚</span>分类</a>
    <a href="study.html"><span class="ic">✏️</span>学习方法</a>
    <a href="profile.html"><span class="ic">👤</span>我的</a>
  </nav>
</div>
<script>
(function(){
  var input = document.getElementById('sid');
  var msg = document.getElementById('msg');
  function submit(){
    var v = (input.value || '').trim().toUpperCase().replace(/\s+/g, '');
    if (v === 'CMX-CS-20260615') {
      msg.className = 'msg ok';
      msg.textContent = '服务ID验证通过，正在进入认知强化服务…';
      setTimeout(function(){ window.location.href = '../platform/cognitive-record.html'; }, 800);
    } else if (v === '') {
      msg.className = 'msg err';
      msg.textContent = '请输入服务ID。';
    } else {
      msg.className = 'msg err';
      msg.textContent = '未找到该服务ID，请确认后重试。';
    }
  }
  document.getElementById('go').addEventListener('click', submit);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
})();
</script>
</body>
</html>
