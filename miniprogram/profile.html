.stats .lb{font-size:11px;color:#999;margin-top:4px}
.card{background:#fff;border-radius:12px;margin:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #f4f4f4;font-size:14px}

.row .ic{width:24px;text-align:center;font-size:16px}
.row .lb{flex:1}
.row .rt{font-size:12px;color:#bbb}
.row .arrow{color:#ccc}

.order .oh{display:flex;justify-content:space-between;font-size:11px;color:#999;margin-bottom:10px}
.order .oh .st{color:#07c160}

.tabbar a .ic{font-size:18px;line-height:1}
.tabbar a.active{color:#07c160}
.foot{text-align:center;font-size:11px;color:#c8c8c8;padding:10px 0 4px}
