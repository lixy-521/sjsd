<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>在线客服 · 山经海集</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:#ededed;color:#333}
a{text-decoration:none;color:inherit}
.phone{max-width:420px;min-height:100vh;margin:0 auto;background:#ededed;position:relative;box-shadow:0 0 24px rgba(0,0,0,.06);display:flex;flex-direction:column}
.mp-nav{position:sticky;top:0;z-index:50;height:52px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 8px;gap:4px;flex:0 0 auto}
.mp-nav .back{min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:50%;color:#333}
.mp-nav .title{flex:1;text-align:center;font-size:16px;font-weight:600}
.capsule{display:flex;align-items:center;gap:7px;border:1px solid #e6e6e6;border-radius:16px;padding:5px 10px;background:#f7f7f7;font-size:14px;color:#555;line-height:1}
.capsule .dv{width:1px;height:14px;background:#e0e0e0}
.tip{text-align:center;font-size:11px;color:#aaa;padding:10px}
.chat{flex:1;padding:0 10px 10px;overflow-y:auto}
.row{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start}
.row.me{flex-direction:row-reverse}
.ava{width:34px;height:34px;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
.row.bot .ava{background:#07c160}
.row.me .ava{background:#4a86b8}
.bubble{max-width:76%;background:#fff;padding:10px 12px;border-radius:4px 8px 8px 8px;font-size:13.5px;line-height:1.75;word-break:break-word;white-space:pre-line;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.row.me .bubble{background:#95ec69;border-radius:8px 4px 8px 8px}
.bubble .hl{color:#e54d42;font-weight:600}
.bubble .mono{font-family:"Courier New",monospace;color:#b0452f}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 10px 8px;flex:0 0 auto}
.chips button{flex:0 0 auto;border:1px solid #dcdcdc;background:#fff;color:#555;font-size:12px;padding:5px 12px;border-radius:14px;font-family:inherit;cursor:pointer}
.chips button:active{background:#f0f0f0}
.inputbar{position:sticky;bottom:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f7f7f7;border-top:1px solid #e6e6e6;flex:0 0 auto}
.inputbar input{flex:1;height:38px;border:none;border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit;outline:none;background:#fff}
.inputbar button{height:38px;padding:0 18px;border:none;background:#07c160;color:#fff;border-radius:8px;font-size:14px;font-family:inherit;cursor:pointer}
.inputbar button:disabled{background:#bfe6cf}
</style>
</head>
<body>
<div class="phone">
  <header class="mp-nav">
    <a class="back" href="profile.html" title="返回">←</a>
    <span class="title">在线客服</span>
    <span class="capsule">···<span class="dv"></span>⊙</span>
  </header>

  <div class="tip">山经海集 · 智能客服为您服务（9:00—21:00）</div>

  <div class="chat" id="chat">
    <div class="row bot">
      <div class="ava">客</div>
      <div class="bubble">您好，这里是山经海集在线客服，请问有什么可以帮您？
您可以回复关键词快速获取帮助：评估 / 平台 / 2999 / 认知同步 / 内参 / 服务ID。</div>
    </div>
  </div>

  <div class="chips" id="chips">
    <button type="button">评估</button>
    <button type="button">平台</button>
    <button type="button">2999</button>
    <button type="button">认知同步</button>
    <button type="button">内参</button>
    <button type="button">服务ID</button>
    <button type="button">转人工</button>
  </div>

  <div class="inputbar">
    <input id="input" type="text" placeholder="请输入您的问题" autocomplete="off" spellcheck="false">
    <button id="send" type="button">发送</button>
  </div>
</div>
<script>
(function(){
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');

  var RULES = [
    { k: ['服务id', '服务 id', 'id'], r: '服务ID是「认知强化服务」的专属查询凭证。\n如果您在学员评估报告里发现了形如 <span class="mono">XX-XX-2026xxxx</span> 的编号，可以到「我的 → 服务ID查询」中输入查看。' },
    { k: ['认知强化', '强化服务', '强化'], r: '认知强化服务是山经书店在线服务平台的一部分，不对外开放，需凭服务ID进入。具体介绍请到店咨询店员。' },
    { k: ['认知同步', '同步'], r: '认知同步技术能将高效的认知模式直接传输给使用者，效果是传统学习的 <span class="hl">3—5 倍</span>。如需了解原理，请到店咨询。' },
    { k: ['2999'], r: '价格不同的商品对应不同的学习方式。具体区别请到店咨询。' },
    { k: ['内参'], r: '抱歉，您没有查看内部资料的权限。相关内容仅对内部人员开放。' },
    { k: ['平台', '网站', '网址'], r: '山经书店在线服务平台目前提供评估预约、报告下载与志愿者服务。如需直接访问，请咨询店员获取入口。' },
    { k: ['评估'], r: '评估服务可帮助学生诊断学习中的知识漏洞。您可在平台「评估预约」中登记时间，或直接到店咨询。' },
    { k: ['退款', '退货', '发货', '物流', '订单'], r: '订单相关问题请提供订单号，或到店联系店员协助处理。给您带来不便敬请谅解。' },
    { k: ['转人工', '人工', '客服'], r: '人工客服当前繁忙，请稍后再试，或到店联系店员。' },
    { k: ['你好', '您好', '在吗', 'hi', 'hello', '喂'], r: '您好，这里是山经海集在线客服。请问有什么可以帮您？' },
    { k: ['谢谢', '感谢', '好的'], r: '不客气，祝您学习进步！如有其他问题欢迎随时咨询。' }
  ];

  var FALLBACK = '您好，您的问题我们已经记录。客服人员会尽快回复您，也可以到店咨询店员。\n（如涉及订单、评估、平台等，请直接回复对应关键词。）';

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function addRow(who, html){
    var row = document.createElement('div');
    row.className = 'row ' + who;
    var ava = document.createElement('div');
    ava.className = 'ava';
    ava.textContent = who === 'bot' ? '客' : '我';
    var bub = document.createElement('div');
    bub.className = 'bubble';
    bub.innerHTML = html;
    row.appendChild(ava);
    row.appendChild(bub);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function reply(text){
    var t = text.toLowerCase();
    for (var i = 0; i < RULES.length; i++) {
      for (var j = 0; j < RULES[i].k.length; j++) {
        if (t.indexOf(RULES[i].k[j]) !== -1) return RULES[i].r;
      }
    }
    return FALLBACK;
  }

  function send(text){
    var v = (text === undefined ? input.value : text);
    v = (v || '').trim();
    if (!v) return;
    addRow('me', esc(v));
    input.value = '';
    sendBtn.disabled = true;
    setTimeout(function(){
      addRow('bot', reply(v));
      sendBtn.disabled = false;
    }, 480);
  }

  sendBtn.addEventListener('click', function(){ send(); });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });

  var chips = document.getElementById('chips');
  chips.addEventListener('click', function(e){
    if (e.target && e.target.tagName === 'BUTTON') send(e.target.textContent);
  });
})();
</script>
</body>
</html>
